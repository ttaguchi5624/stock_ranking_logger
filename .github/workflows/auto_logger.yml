name: Auto Stock Logger

on:
  schedule:
      # Run at 21:30 UTC every Mon-Fri (06:30 JST next morning)
          - cron: '30 21 * * 1-5'
            workflow_dispatch: # Manual execution

            jobs:
              run-logger:
                  runs-on: ubuntu-latest

                          # Permissions for writing to the repository
                              permissions:
                                    contents: write

                                        steps:
                                            - name: Checkout repository
                                                  uses: actions/checkout@v4

                                                      - name: Set up Python
                                                            uses: actions/setup-python@v5
                                                                  with:
                                                                          python-version: '3.10'

                                                                              - name: Install dependencies
                                                                                    run: |
                                                                                            python -m pip install --upgrade pip
                                                                                                    pip install -r requirements.txt
                                                                                                    
                                                                                                        - name: Run auto logger script
                                                                                                              run: python auto_logger.py
                                                                                                              
                                                                                                                  - name: Commit and push changes
                                                                                                                        run: |
                                                                                                                                git config --global user.name 'github-actions[bot]'
                                                                                                                                        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
                                                                                                                                                git add stock_rankings_log.txt auto_logger.log
                                                                                                                                                        git commit -m "Data automatically updated by Action" || echo "No changes to commit"
                                                                                                                                                                git push
                                                                                                                                                                
