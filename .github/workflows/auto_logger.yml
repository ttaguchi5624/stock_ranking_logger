{name: "Auto Stock Logger", on: ["workflow_dispatch", {schedule: [{cron: "30 21 * * 1-5"}]}], jobs: {run-logger: {runs-on: "ubuntu-latest", permissions: {contents: "write"}, steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-python@v5", with: {python-version: "3.10"}}, {name: "Install dependencies", run: "python -m pip install --upgrade pip\npip install -r requirements.txt"}, {name: "Run script", run: "python auto_logger.py"}, {name: "Commit and push", run: "git config --global user.name 'bot'\ngit config --global user.email 'bot@bot.com'\ngit add .\ngit commit -m 'update' || exit 0\ngit push"}]}}}